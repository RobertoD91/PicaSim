name: GitHub Release

# Monthly multi-platform PRE-release of the unsigned builds: Linux AppImages
# (x86_64 + aarch64), Windows x64 zip and Android debug APK. Only the 3 most
# recent monthly prereleases are kept; older ones (and their tags) are
# deleted. The signed macOS DMG and the TestFlight build are handled by their
# own workflows (macos-release.yml, ios-testflight.yml); proper "full"
# releases are made manually via official-release.yml.
#
# Publishing is opt-in: the workflow only runs when the repository variable
# PICASIM_PUBLISH_RELEASES is set to 'true' (Settings → Secrets and variables
# → Actions → Variables tab), so it is a no-op on forks/upstream that have
# not opted in.
#
# The published artifacts are downloaded by end users, so this workflow
# follows the same rule as the signed release workflows: no third-party
# actions (only actions/* from GitHub itself). See RELEASE_SIGNING.md.

on:
  schedule:
    - cron: '0 5 1 * *'  # 05:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-linux:
    if: vars.PICASIM_PUBLISH_RELEASES == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            configure_preset: linux-x64
            build_preset: linux-x64-release
            runner: ubuntu-24.04
          - arch: arm64
            configure_preset: linux-arm64
            build_preset: linux-arm64-release
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    name: Build Linux (${{ matrix.arch }})

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ \
            libgl-dev libgles-dev libegl-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev libdbus-1-dev \
            libwayland-dev libpipewire-0.3-dev \
            rsync

      - name: Configure CMake
        run: |
          cmake --preset ${{ matrix.configure_preset }}

      - name: Build Release
        run: |
          cmake --build --preset ${{ matrix.build_preset }}

      - name: Create AppImage
        run: |
          ./linux_create_appimage.sh build/${{ matrix.configure_preset }} dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/PicaSim-*.AppImage
          retention-days: 1

  build-windows:
    if: vars.PICASIM_PUBLISH_RELEASES == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    name: Build Windows (x64)

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Manual vcpkg setup pinned to the manifest baseline (no third-party
      # actions in release workflows, see header comment).
      - name: Setup vcpkg
        run: |
          $commit = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          git clone https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP\vcpkg"
          git -C "$env:RUNNER_TEMP\vcpkg" checkout $commit
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure CMake
        run: |
          cmake --preset windows-x64

      - name: Build Release
        run: |
          cmake --build --preset windows-x64-release

      - name: Install and package
        run: |
          cmake --install build/windows-x64 --config Release
          $ver = (Select-String -Path VERSIONS.txt -Pattern 'Version ([0-9.]+)').Matches[0].Groups[1].Value
          Compress-Archive -Path "dist/PicaSim-$ver" -DestinationPath "PicaSim-$ver-windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: PicaSim-*-windows-x64.zip
          retention-days: 1

  build-android:
    if: vars.PICASIM_PUBLISH_RELEASES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Build Android (APK)

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # The Android SDK is preinstalled on ubuntu-latest runners; only the
      # pinned NDK needs installing (same version as android-build.yml).
      - name: Install NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;25.2.9519653"

      - name: Generate asset manifest
        run: |
          python3 tools/generate_asset_manifest.py data data/assets_manifest.txt packaging_excludes.txt

      - name: Build debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          VERSION=$(grep -oE 'Version [0-9.]+' VERSIONS.txt | head -1 | sed 's/Version //')
          cp android/app/build/outputs/apk/debug/app-debug.apk "PicaSim-${VERSION}-android-debug.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: PicaSim-*-android-debug.apk
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oE 'Version [0-9.]+' VERSIONS.txt | head -1 | sed 's/Version //')
          TAG="v${VERSION}-$(date +%Y%m%d)"

          ls -lh assets/

          {
            echo "Automated monthly multi-platform build of PicaSim ${VERSION} from commit ${GITHUB_SHA}."
            echo ""
            echo "- **Linux**: AppImage for x86_64 and aarch64 (\`chmod +x\` and run)"
            echo "- **Windows**: x64 zip (extract and run PicaSim.exe)"
            echo "- **Android**: debug APK for sideloading"
            echo ""
            echo "This is a rolling monthly pre-release: only the 3 most recent are kept."
            echo "For stable downloads use the latest full release. The signed and notarized"
            echo "macOS DMG is published separately by the 'macOS Signed Release' workflow."
          } > "$RUNNER_TEMP/release-notes.md"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists, uploading assets (clobber)."
            gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "PicaSim $VERSION (monthly)" \
              --prerelease \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      # Rolling retention: keep only the 3 most recent monthly prereleases
      # (tags like v1.4.0-20260801); delete older ones together with their tags.
      - name: Prune old monthly prereleases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            | jq -r '[ .[] | select(.tagName | test("^v[0-9.]+-[0-9]{8}$")) ]
                     | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
            | while read -r OLD_TAG; do
                echo "Deleting old monthly prerelease: $OLD_TAG"
                gh release delete "$OLD_TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
              done
