name: iOS TestFlight

# Monthly signed build uploaded to TestFlight.
#
# The workflow does not hardcode a repository name: a preliminary job checks
# that the required signing secrets are configured and skips everything
# otherwise, so it is a no-op on forks/upstream without secrets.
#
# Required repository secrets:
#   IOS_DIST_CERT_P12_BASE64         - Apple Distribution certificate (.p12), base64-encoded
#   IOS_DIST_CERT_PASSWORD           - password of the .p12 above
#   IOS_PROVISIONING_PROFILE_BASE64  - App Store provisioning profile for
#                                      it.robertodisanto.PicaSim, base64-encoded
#   APP_STORE_CONNECT_KEY_ID         - App Store Connect API key ID
#   APP_STORE_CONNECT_ISSUER_ID      - App Store Connect API issuer ID
#   APP_STORE_CONNECT_API_KEY_BASE64 - App Store Connect API private key (.p8), base64-encoded

on:
  schedule:
    - cron: '0 3 1 * *'  # 03:00 UTC on the 1st of every month
  workflow_dispatch:

# This workflow handles signing material, so it deliberately uses no
# third-party actions (only actions/checkout from GitHub itself) and runs
# with a read-only token. See RELEASE_SIGNING.md.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - name: Check required secrets
        id: check
        env:
          SECRETS_PRESENT: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.IOS_DIST_CERT_PASSWORD != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.APP_STORE_CONNECT_KEY_ID != '' && secrets.APP_STORE_CONNECT_ISSUER_ID != '' && secrets.APP_STORE_CONNECT_API_KEY_BASE64 != '' }}
        run: |
          echo "ok=$SECRETS_PRESENT" >> "$GITHUB_OUTPUT"
          if [ "$SECRETS_PRESENT" != "true" ]; then
            echo "iOS signing secrets are not configured on this repository; skipping TestFlight upload." >> "$GITHUB_STEP_SUMMARY"
          fi

  testflight:
    name: Build, sign and upload to TestFlight
    needs: check-secrets
    if: needs.check-secrets.outputs.ok == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      TEAM_ID: 486X3EYM77
      BUNDLE_ID: it.robertodisanto.PicaSim
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Import signing certificate and provisioning profile
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/picasim-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/dist-cert.p12"
          echo -n "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$CERT_PATH"

          PROFILE_PATH="$RUNNER_TEMP/PicaSim.mobileprovision"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          # Older and newer Xcode versions look in different directories
          for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$PROFILE_PATH" "$DIR/$PROFILE_UUID.mobileprovision"
          done
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
          echo "API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      # CMake's Xcode generator does not create schemes by default (locally
      # Xcode auto-creates them when the project is opened in the GUI, which
      # never happens in CI), so ask CMake to generate shared schemes.
      - name: Configure CMake
        run: |
          cmake --preset ios-device \
            -DCMAKE_XCODE_GENERATE_SCHEME=ON \
            -DPICASIM_IOS_BUILD_NUMBER=${{ github.run_number }}.${{ github.run_attempt }}

      - name: Verify generated project and schemes
        run: |
          xcodebuild -list -project build/ios-device/PicaSim.xcodeproj
          SCHEME_FILE="build/ios-device/PicaSim.xcodeproj/xcshareddata/xcschemes/PicaSim.xcscheme"
          if [ ! -f "$SCHEME_FILE" ]; then
            echo "ERROR: 'PicaSim' shared scheme not found at $SCHEME_FILE."
            echo "CMAKE_XCODE_GENERATE_SCHEME did not generate schemes as expected."
            exit 1
          fi

      # Same two-step process as ios_archive.sh: first build with CMake's
      # hardcoded CONFIGURATION_BUILD_DIR so static libraries land where the
      # linker expects them, then archive with the override so the dSYM is
      # copied into the .xcarchive. Step 1 is unsigned (libraries only need
      # compiling); the app is signed during the archive step.
      - name: Build dependencies (unsigned)
        run: |
          xcodebuild build \
            -project build/ios-device/PicaSim.xcodeproj \
            -scheme PicaSim \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Archive (signed)
        run: |
          xcodebuild archive \
            -project build/ios-device/PicaSim.xcodeproj \
            -scheme PicaSim \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PicaSim.xcarchive" \
            CONFIGURATION_BUILD_DIR='$(BUILD_DIR)/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"

          if [ -d "$RUNNER_TEMP/PicaSim.xcarchive/dSYMs/PicaSim.app.dSYM" ]; then
            echo "dSYM included in archive."
          else
            echo "WARNING: dSYM not found in archive."
          fi

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PROFILE_NAME</string>
              </dict>
              <key>uploadSymbols</key>
              <true/>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PicaSim.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

          echo "Uploaded build ${{ github.run_number }}.${{ github.run_attempt }} to TestFlight." >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up signing material
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" \
                  "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          if [ -n "${API_KEY_PATH:-}" ]; then
            rm -f "$API_KEY_PATH"
          fi
