name: macOS Multi-Architecture Release

on:
  push:
    branches:
      - main
      - refactor1
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            configure_preset: macos-arm64
            build_preset: macos-arm64-release
            runner: macos-latest
          - arch: x86_64
            configure_preset: macos-x64
            build_preset: macos-x64-release
            runner: macos-15-intel
    
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CCACHE_MAXSIZE: 500M

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Install ccache
        run: brew install ccache

      # Compiler cache: third-party sources (SDL2, OpenAL, Bullet, ...) rarely
      # change, so warm-cache builds skip most of the compilation.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-macos-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-${{ matrix.arch }}-

      - name: Configure CMake
        run: |
          cmake --preset ${{ matrix.configure_preset }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cmake --build --preset ${{ matrix.build_preset }}
          ccache --show-stats

      - name: Install
        run: |
          cmake --install build/${{ matrix.configure_preset }} --config Release

      - name: Create app bundle
        run: |
          ./macos_create_app_bundle.sh dist/PicaSim-*/ dist

      # Only the .app is needed by the merge job; tar preserves the executable
      # permissions that upload-artifact would otherwise drop.
      - name: Package app bundle
        run: |
          tar -czf picasim-app-${{ matrix.arch }}.tar.gz -C dist PicaSim.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: picasim-${{ matrix.arch }}
          path: picasim-app-${{ matrix.arch }}.tar.gz
          retention-days: 1

  merge-universal:
    needs: build-macos
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Download ARM64 build
        uses: actions/download-artifact@v4
        with:
          name: picasim-arm64

      - name: Download x86_64 build
        uses: actions/download-artifact@v4
        with:
          name: picasim-x86_64

      - name: Create universal binary
        run: |
          mkdir dist-arm64 dist-x86_64 dist-universal
          tar -xzf picasim-app-arm64.tar.gz -C dist-arm64
          tar -xzf picasim-app-x86_64.tar.gz -C dist-x86_64

          # Copy arm64 app as base
          cp -R dist-arm64/PicaSim.app dist-universal/PicaSim.app

          echo "Creating universal binary for PicaSim..."
          lipo -create \
            dist-arm64/PicaSim.app/Contents/MacOS/PicaSim \
            dist-x86_64/PicaSim.app/Contents/MacOS/PicaSim \
            -output dist-universal/PicaSim.app/Contents/MacOS/PicaSim
          chmod +x dist-universal/PicaSim.app/Contents/MacOS/PicaSim \
                   dist-universal/PicaSim.app/Contents/MacOS/PicaSim-launcher

          echo "Verifying universal binary..."
          file dist-universal/PicaSim.app/Contents/MacOS/PicaSim
          lipo -info dist-universal/PicaSim.app/Contents/MacOS/PicaSim

      - name: Create universal DMG
        run: |
          ./macos_create_dmg.sh dist-universal/PicaSim.app dist-universal

          # Verify DMG was created
          ls -lh dist-universal/PicaSim-*.dmg

      # The DMG is the deliverable; a raw .app inside a zipped artifact would
      # lose its executable permissions on download anyway.
      - name: Upload universal build
        uses: actions/upload-artifact@v4
        with:
          name: picasim-universal
          path: dist-universal/PicaSim-*.dmg
          retention-days: 30
