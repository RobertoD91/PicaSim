name: Linux Build

on:
  push:
    branches:
      - main
      - refactor1
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            configure_preset: linux-x64
            build_preset: linux-x64-release
            runner: ubuntu-24.04
            appimage_arch: x86_64
          - arch: arm64
            configure_preset: linux-arm64
            build_preset: linux-arm64-release
            runner: ubuntu-24.04-arm
            appimage_arch: aarch64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CCACHE_MAXSIZE: 500M

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ ccache \
            libgl-dev libgles-dev libegl-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev libdbus-1-dev \
            libwayland-dev libpipewire-0.3-dev \
            rsync

      # Compiler cache: third-party sources (SDL2, OpenAL, Bullet, ...) rarely
      # change, so warm-cache builds skip most of the compilation.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-${{ matrix.arch }}-

      - name: Configure CMake
        run: |
          cmake --preset ${{ matrix.configure_preset }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build Release
        run: |
          cmake --build --preset ${{ matrix.build_preset }}
          ccache --show-stats

      - name: Create AppImage
        run: |
          ./linux_create_appimage.sh build/${{ matrix.configure_preset }} dist

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: picasim-linux-${{ matrix.arch }}
          path: dist/PicaSim-*.AppImage
          retention-days: 30
