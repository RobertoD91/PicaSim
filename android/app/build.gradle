apply plugin: 'com.android.application'

// Parse version from VERSIONS.txt (single source of truth)
def versionsFile = file("${projectDir}/../../VERSIONS.txt")
def parsedVersionName = "1.0.0"
if (versionsFile.exists()) {
    def firstLine = versionsFile.readLines().first()
    def matcher = firstLine =~ /Version\s+(\d+\.\d+\.\d+)/
    if (matcher.find()) {
        parsedVersionName = matcher.group(1)
    }
}
// Version code scheme: 2MMNNPP where 2 = SDL2 rewrite prefix, MM.NN.PP = version parts
def versionParts = parsedVersionName.split('\\.')
def parsedVersionCode = 2000000 +
    (versionParts[0] as int) * 10000 +
    (versionParts[1] as int) * 100 +
    (versionParts[2] as int)

// CI passes -PpicasimBuildNumber=<run number> so every CI build gets a
// strictly increasing versionCode and installs as an update over the
// previous one. Scheme: <2MMNNPP>000 + build (build capped at 999 so a
// version bump always outranks any build number). Local builds get 0.
def picasimBuildNumber = (project.hasProperty('picasimBuildNumber') ? project.property('picasimBuildNumber') as int : 0) % 1000
parsedVersionCode = parsedVersionCode * 1000 + picasimBuildNumber

// Load signing keystore properties (not committed to git)
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.rowlhouse.picasim"
    compileSdkVersion 35

    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'] ?: '/dev/null')
            storePassword keystoreProperties['storePassword'] ?: ''
            keyAlias keystoreProperties['keyAlias'] ?: ''
            keyPassword keystoreProperties['keyPassword'] ?: ''
        }
        // Debug signing, in order of preference:
        // 1. A custom keystore provided via environment (CI secrets, see the
        //    "Set up signing keystore" workflow step): PICASIM_KEYSTORE_FILE,
        //    PICASIM_KEYSTORE_PASSWORD, PICASIM_KEY_ALIAS, PICASIM_KEY_PASSWORD.
        // 2. Fallback: a keystore committed to the repo (standard Android
        //    debug credentials, nothing sensitive) so that local and CI debug
        //    builds all share one signature and can install over each other.
        //    Without a stable key, every CI runner generates its own and adb
        //    install fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE.
        debug {
            def ciKeystore = System.getenv("PICASIM_KEYSTORE_FILE")
            if (ciKeystore) {
                storeFile file(ciKeystore)
                storePassword System.getenv("PICASIM_KEYSTORE_PASSWORD")
                keyAlias System.getenv("PICASIM_KEY_ALIAS")
                keyPassword System.getenv("PICASIM_KEY_PASSWORD")
            } else {
                storeFile rootProject.file("debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    defaultConfig {
        applicationId "com.rowlhouse.picasim"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode parsedVersionCode
        versionName parsedVersionName

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared",
                          "-DANDROID_APP_PLATFORM=android-21"
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }

    // Prefab exposes native libraries from AARs (the Khronos OpenXR loader)
    // to the CMake build via find_package(OpenXR CONFIG).
    buildFeatures {
        prefab true
    }

    // Product flavors: 'phone' is the regular Android build (VR off, unchanged
    // behavior); 'quest' targets Meta Quest headsets with OpenXR VR support.
    flavorDimensions "device"
    productFlavors {
        phone {
            dimension "device"
            externalNativeBuild {
                cmake {
                    arguments "-DPICASIM_ENABLE_VR=OFF"
                }
            }
        }
        quest {
            dimension "device"
            // The OpenXR loader AAR declares minSdk 24; Quest headsets all
            // run API 29+ anyway.
            minSdkVersion 29
            externalNativeBuild {
                cmake {
                    arguments "-DPICASIM_QUEST=ON"
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            version "3.22.1+"
        }
    }

    // Bundle game data as Android assets
    sourceSets {
        main {
            assets.srcDirs = ['../../data']
            // Include SDL2 Java sources directly
            java.srcDirs = [
                'src/main/java',
                '../../third_party/SDL2/android-project/app/src/main/java'
            ]
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    lint {
        abortOnError false
    }
}

// Regenerate asset manifest before every build so new/removed data files
// are always picked up (the manifest drives extraction on first launch).
task generateAssetManifest(type: Exec) {
    def projectRoot = file("${projectDir}/../..")
    commandLine 'python', "${projectRoot}/tools/generate_asset_manifest.py",
            "${projectRoot}/data",
            "${projectRoot}/data/assets_manifest.txt",
            "${projectRoot}/packaging_excludes.txt"
}
preBuild.dependsOn generateAssetManifest

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // Khronos OpenXR loader (AAR with prefab support) — quest flavor only
    questImplementation 'org.khronos.openxr:openxr_loader_for_android:1.1.49'
}
